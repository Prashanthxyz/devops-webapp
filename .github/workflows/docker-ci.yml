name: Docker CI Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512399769425:role/GitHubActionsECRRole
          aws-region: us-east-2
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build -t devops-webapp:$IMAGE_TAG .
      
      - name: Tag Docker image for ECR
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker tag devops-webapp:$IMAGE_TAG \
          512399769425.dkr.ecr.us-east-2.amazonaws.com/devops-webapp:$IMAGE_TAG  

      - name: Push Docker image to ECR
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker push 512399769425.dkr.ecr.us-east-2.amazonaws.com/devops-webapp:$IMAGE_TAG
