name: Docker CI Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Inspect OIDC token claims
        shell: bash
        run: |
          response=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          token=$(echo "$response" | jq -r '.value')
          payload=$(echo "$token" | cut -d '.' -f2)
          echo "$payload" | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref}'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512399769425:role/GitHubActionsECRRole
          aws-region: us-east-2

      - name: Build Docker image
        run: docker build -t devops-webapp:v1 .
